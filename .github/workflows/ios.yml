# iOS 构建与验收
#
# 三条独立链路：
#   check       —— aarch64-apple-ios 类型检查（快，iOS 编译错误主要在这里收敛）
#   desktop     —— Windows 桌面回归（确保这次改动没弄坏原平台）
#   ipa         —— 出未签名 .ipa（等有 iPhone 时用 Sideloadly 侧载）
#   simulator   —— 模拟器里真跑：装包、启动、截图、自检换页前后像素对比
#
# 无 Mac 的机器只能靠这里的 macOS runner 编译；模拟器截图会作为 artifact 上传。

name: iOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (aarch64-apple-ios)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-apple-ios
      - name: Rust ↔ Swift 符号名一致性
        run: python3 ios/check_abi.py
      - run: cargo check --target aarch64-apple-ios --features ios

  desktop:
    name: 桌面回归 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Cargo.toml 里渲染后端按目标重新组合过：Windows/Android 已验，Linux 也得有一腿
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --features gui
      - run: cargo test --features gui

  ipa:
    name: 未签名 .ipa
    needs: check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-apple-ios
      - run: bash ios/build.sh device release
      - uses: actions/upload-artifact@v4
        with:
          name: NekoSportsWorldTool-ios-arm64-ipa
          path: dist/*.ipa
          if-no-files-found: error

  simulator:
    name: 模拟器验收（能起 / 能画 / 换页重绘）
    needs: check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-apple-ios-sim
      - run: bash ios/build.sh simulator release

      - name: 启动模拟器并装包
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available | grep -m1 -E '^[[:space:]]+iPhone' | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f-]{27}' | head -1)"
          if [ -z "$DEVICE" ]; then echo "找不到可用的 iPhone 模拟器"; exit 1; fi
          echo "模拟器: $DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" dist/NekoSportsWorldTool.app

      - name: 跑起来 + 截图 + 自检
        run: |
          set -euo pipefail
          mkdir -p dist/evidence
          SIMCTL_CHILD_NSWT_SELFTEST=1 xcrun simctl launch --console "$DEVICE" org.nekosportsworld.tool > dist/evidence/app.log 2>&1 &
          LAUNCH=$!
          sleep 5
          xcrun simctl io "$DEVICE" screenshot dist/evidence/shot-before.png
          sleep 8
          xcrun simctl io "$DEVICE" screenshot dist/evidence/shot-after.png
          kill "$LAUNCH" 2>/dev/null || true
          xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "NekoSportsWorldTool"' > dist/evidence/system.log 2>&1 || true
          echo "--- app.log 尾部 ---"; tail -40 dist/evidence/app.log || true
          ls -l dist/evidence/

      - name: 断言：截图非空 + 自检换页 + 无 panic
        run: |
          set -euo pipefail
          # runner 的 Homebrew Python 是 externally-managed，不能用 pip 直装 → 用 venv
          python3 -m venv .venv
          ./.venv/bin/pip install --quiet --disable-pip-version-check Pillow
          ./.venv/bin/python ios/ci_assert_screenshots.py dist/evidence
          if grep -qiE 'panic|fatal error' dist/evidence/app.log; then
            echo "日志里出现 panic:"; grep -iE 'panic|fatal error' dist/evidence/app.log | head -5; exit 1
          fi
          if ! grep -q 'SELFTEST: switched tab to 1' dist/evidence/app.log; then
            echo "自检没有换页（app.log 见 artifact）"; exit 1
          fi
          echo "模拟器验收通过"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NekoSportsWorldTool-ios-simulator-evidence
          path: dist/evidence/
