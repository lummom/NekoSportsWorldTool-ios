[package]
name = "nekosportsworldtool"
version = "0.3.0"
edition = "2021"
description = "NekoSportsWorldTool：运动世界校园版协议自动化工具（GUI + CLI）"
license = "CC-BY-NC-4.0"
repository = "https://github.com/YanamiNeko/NekoSportsWorldTool"

[workspace]
members = [".", "crates/route-planner"]
resolver = "2"

[lib]
# staticlib：iOS 静态库（由 ios/main.swift 链接成 app 可执行文件）
crate-type = ["rlib", "cdylib", "staticlib"]

[patch.crates-io]
# NativeActivity must release its event loop on Destroy and allow recreation.
winit = { path = "vendor/winit-0.30.13" }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd"]
android = ["gui", "eframe/android-native-activity", "dep:android-activity", "dep:android_logger", "dep:jni", "dep:log", "dep:winit"]
# iOS：复用同一套 egui 界面。渲染只走 eframe 的 wgpu 后端（iOS 没有 glow/glutin 后端），
# UIKit 相关能力（输入框/文件选择/常亮/安全区）由 ios/main.swift 提供，经 ABI 回调进来。
ios = ["gui"]

[dependencies]
route-planner = { path = "crates/route-planner" }
# 渲染后端按目标在下方各 target 表里指定：桌面/Android 保持 glow（与上游一致），iOS 用 wgpu。
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts"] }
egui = { version = "0.29", optional = true }
egui_extras = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
rsa = "0.9"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
rand_distr = "0.4"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

# ── 桌面（Windows / macOS / Linux）：与上游完全一致的特性组合 ──────────────
# eframe 默认特性 = accesskit + default_fonts + glow + wayland + winit/default + x11
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
eframe = { version = "0.29", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
# 还原 eframe 默认里的 winit/default（x11/wayland 后端 + rwh_06），桌面行为不变
winit = "0.30"
# rfd 无 Android/iOS 后端，仅在桌面目标编译（调用点 osm.rs 已按 cfg 门控）
rfd = { version = "0.15", optional = true }
ureq = { version = "2", default-features = false, features = ["native-certs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow"] }
android-activity = { version = "0.6", features = ["native-activity"], optional = true }
android_logger = { version = "0.14", optional = true }
jni = { version = "0.21", optional = true }
log = { version = "0.4", optional = true }
winit = { version = "0.30", features = ["android-native-activity"], optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "wgpu"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
incremental = false

[profile.dev]
debug = "line-tables-only"
